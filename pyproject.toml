[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hopsworks-agent-protocol"
version = "1.7.1"
description = "Server helpers for the Hopsworks Agent Protocol: make any Python agent chat-ready in the Hopsworks UI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100",
    "pydantic>=2.0",
]

[project.optional-dependencies]
tracing = [
    "opentelemetry-sdk>=1.0.0",
    "opentelemetry-exporter-otlp-proto-http>=1.0.0",
]
langgraph = [
    "hopsworks-agent-protocol[tracing]",
    "openinference-instrumentation-langchain>=0.1.0",
]
llamaindex = [
    "hopsworks-agent-protocol[tracing]",
    "openinference-instrumentation-llama-index>=2.0.0",
]
openai-agents = [
    "hopsworks-agent-protocol[tracing]",
    "openinference-instrumentation-openai-agents>=1.5.0",
]
claude-agents = [
    "hopsworks-agent-protocol[tracing]",
    "openinference-instrumentation-claude-agent-sdk>=0.1.3",
]
memory-sql = [
    "sqlalchemy>=2.0.0",
]
memory-search = [
    "hopsworks-agent-protocol[memory-sql]",
    "sentence-transformers>=2.2.0",
    "pandas>=1.5",
]
# The evaluation side: runs in a Hopsworks job, never in a serving pod. Kept
# behind an extra so an agent image does not carry judges and detectors, and
# so `import hopsworks_agent_protocol` cannot reach them (see
# tests/test_import_isolation.py).
eval = [
    "pandas>=1.5",
    "requests>=2.28",
]
# The LLM judge's provider. Separate from [eval] because most graders need no
# model at all, and a run that uses none should not carry a provider SDK.
eval-judge = [
    "hopsworks-agent-protocol[eval]",
    "anthropic>=0.40",
]
dev = [
    "pytest",
    "httpx",
    "uvicorn",
    "sqlalchemy>=2.0.0",
    # the turn span and baggage propagation are only exercisable with a real
    # tracer provider and an in-memory exporter
    "opentelemetry-sdk>=1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["hopsworks_agent_protocol", "hopsworks_agent_eval"]
